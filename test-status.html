<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Test Status Dot</title>
  <style>
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      display: inline-block;
      background: #bbb;
      box-shadow: 0 0 0 2px rgba(0,0,0,0.04) inset;
    }
    .status-dot.is-open {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e66;
    }
    .status-dot.is-closed {
      background: #ef4444;
    }
    body { font-family: Arial; padding: 20px; }
  </style>
</head>
<body data-page="home">
  <h1>Test Status Dot</h1>
  <p>
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">Testando...</span>
  </p>

  <script src="assets/js/config.js"></script>
  <script>
    console.log('Test page loaded');
    const byId = id => document.getElementById(id);
    const C = window.CONFIG;
    
    if(!C) {
      console.error('CONFIG not loaded!');
    } else {
      console.log('CONFIG loaded:', C.business.hours);
    }

    const dot = byId('status-dot');
    const txt = byId('status-text');
    
    console.log('dot element:', dot);
    console.log('txt element:', txt);

    if (dot && txt) {
      const hours = C.business?.hours || { mon_sat: '10:00–20:00', sun: '10:00–13:00' };
      console.log('hours:', hours);

      function parseRange(range) {
        if (!range) return null;
        console.log('parseRange input:', range);
        const m = String(range).match(/^(\d{1,2}):(\d{2})\s*[-–—]\s*(\d{1,2}):(\d{2})$/);
        console.log('parseRange match:', m);
        if (!m) return null;
        return { fromH: +m[1], fromM: +m[2], toH: +m[3], toM: +m[4] };
      }

      function nextOpenInfo(now) {
        const d = new Date(now);
        const day = d.getDay();
        const isSun = day === 0;
        const rangeStr = isSun ? hours.sun : hours.mon_sat;
        const r = parseRange(rangeStr);
        const hhmm = (h, m) => `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        
        if (!r) {
          console.log('parseRange returned null!');
          return { open: false, label: '' };
        }

        const curMin = d.getHours() * 60 + d.getMinutes();
        const fromMin = r.fromH * 60 + r.fromM;
        const toMin = r.toH * 60 + r.toM;
        
        console.log('Current time - curMin:', curMin, 'fromMin:', fromMin, 'toMin:', toMin);

        if (curMin >= fromMin && curMin < toMin) {
          return { open: true, closesAt: hhmm(r.toH, r.toM) };
        }
        if (curMin < fromMin) {
          return { open: false, label: `Abre às ${hhmm(r.fromH, r.fromM)}` };
        }

        const nextDay = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, 0, 0, 0);
        const nextIsSun = nextDay.getDay() === 0;
        const nr = parseRange(nextIsSun ? hours.sun : hours.mon_sat);
        if (nr) {
          return { open: false, label: `Abre às ${hhmm(nr.fromH, nr.fromM)}` };
        }
        return { open: false, label: '' };
      }

      function updateStatus() {
        const info = nextOpenInfo(new Date());
        console.log('updateStatus info:', info);
        dot.classList.remove('is-open', 'is-closed');
        if (info.open) {
          dot.classList.add('is-open');
          txt.textContent = info.closesAt ? `Aberto agora — Fecha às ${info.closesAt}` : 'Aberto agora';
        } else {
          dot.classList.add('is-closed');
          txt.textContent = info.label || 'Fechado';
        }
        console.log('dot classes:', dot.className);
      }

      updateStatus();
      setInterval(updateStatus, 60000);
    } else {
      console.error('Elements not found - dot:', dot, 'txt:', txt);
    }
  </script>
</body>
</html>
